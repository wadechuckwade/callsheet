# Keeps the Supabase side of Callsheet up to date: database changes and server functions.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
name: Update Supabase
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add a repository secret called SUPABASE_ACCESS_TOKEN (see README → Server updates)."; exit 1
          fi
          REF=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')
          if [ -z "$REF" ]; then echo "::error::No Supabase URL in config.js"; exit 1; fi
          echo "REF=$REF" >> "$GITHUB_ENV"
      - name: Apply database changes
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            jq -Rs '{query: .}' "$f" > /tmp/q.json
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json)
            cat /tmp/out.json; echo
            if [ "$code" -ge 300 ]; then echo "::error::$f failed ($code)"; exit 1; fi
          done
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy server functions
        run: |
          for d in supabase/functions/*/; do
            name=$(basename "$d")
            echo "Deploying $name"
            supabase functions deploy "$name" --project-ref "$REF" --no-verify-jwt
          done
