function projectDeadlineDays(pid){
  let best = null;
  list('deadlines').forEach(d => {
    if (d.projectId !== pid || !d.date || ['submitted','result','skip'].includes(d.status)) return;
    const n = daysUntil(d.date); if (n >= 0 && (best == null || n < best)) best = n;
  });
  return best;
}
function scoreTask(t){
  const p = S.projects[t.projectId];
  const mins = Math.max(5, effMins(t));
  const impact = +t.impact || 2;
  const reasons = [];
  let s = ({1:1, 2:2.2, 3:4}[impact]) * Math.pow(60 / mins, W('time'));   // progress per hour; weight 0 ignores time
  if (mins <= 20 && impact >= 2) reasons.push(['Quick win','']);

function gcErrMsg(e){

    case 'server_not_connected': return 'Add Google Calendar in claude.ai Settings → Connectors to see your busy times here.';

function addGEvent(out, ev, cal, shiftCal){
  const free = ev.transparency === 'transparent' || ev.availability === 'AVAILABILITY_FREE';
  const shift = (!!shiftCal && cal.id === shiftCal) || /deputy|rota|work shift/i.test(cal.summary || '');
  const base = { id: ev.id, title: ev.summary || 'Busy', free, shift, cal: cal.summary || '', link: ev.htmlLink || '', loc: ev.location || '' };
  if (ev.start && ev.start.date) {
    const s = String(ev.start.date).slice(0, 10); const e = String((ev.end && ev.end.date) || ev.start.date).slice(0, 10);
    let d = s; let n = 0; do { (out[d] = out[d] || []).push({ ...base, allDay: true }); d = addDays(d, 1); } while (d < e && ++n < 31);
    return;
  }
  if (!ev.start || !ev.start.dateTime) return;
  const sd = new Date(ev.start.dateTime), ed = new Date((ev.end && ev.end.dateTime) || ev.start.dateTime);
  let cur = new Date(sd); let n = 0;
  while (cur < ed && n++ < 14) {
    const dayEnd = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
    const s = cur.getHours() * 60 + cur.getMinutes(); const en = ed < dayEnd ? ed.getHours() * 60 + ed.getMinutes() : 1440;
    (out[dstr(cur)] = out[dstr(cur)] || []).push({ ...base, s, en: Math.max(en, s + 15) });
    cur = dayEnd;
  }
}
async function gcLoadRange(from, to, force){
  if (!S.mcp) return;

  S.gcalKey = key; S.gcalState = 'loading'; render();
  try {
    if (!S.gcals || !S.gcals.length) { const p = await gcCall('list_calendars', {}); S.gcals = (p && p.calendars) || []; }
    const c = calCfg();
    const cals = S.gcals.filter(x => !/#holiday@/.test(x.id) && x.id !== c.targetCal);
    const ours = new Set([...list('sessions'), ...list('events'), ...list('deadlines')].map(x => x.gcalId).filter(Boolean));
    const out = {};
    for (const cal of cals) {
      let token = ''; let guard = 0;
      do {
        const p = await gcCall('list_events', { calendarId: cal.id, startTime: from + 'T00:00:00', endTime: to + 'T00:00:00', pageSize: 250, orderBy: 'startTime', ...(token ? { pageToken: token } : {}) });
        ((p && p.events) || []).forEach(ev => { if (!ev || ours.has(ev.id) || ev.status === 'cancelled') return; addGEvent(out, ev, cal, c.shiftCal); });

}

/* ---------- scouts (search now) ---------- */
const SCOUT_INFO = { jobs: { name: 'job scout', what: 'new jobs', sched: 'Also runs by itself every Monday and Thursday morning', col: 'jobs' }, deadlines: { name: 'opportunity scout', what: 'new opportunities', sched: 'Also runs by itself every Monday morning', col: 'deadlines' } };
const scoutDoc = () => (S.settings && S.settings.scout) || {};
function scoutState(k){ const d = scoutDoc()[k] || {}; const local = (S.scoutLocal || {})[k];
  const st = { ...d }; if (local && (!d.startedAt || local.at > d.startedAt)) { st.state = 'queued'; st.startedAt = local.at; st.pct = 2; st.added = 0; st.step = 'Starting the scout… (this takes about a minute)'; }
  const age = st.startedAt ? Date.now() - st.startedAt : 0;
  st.running = (st.state === 'running' || st.state === 'queued') && age < 45 * 60000; st.slow = st.running && age > 25 * 60000; return st; }
function scoutPanel(k){
  const I = SCOUT_INFO[k]; const st = scoutState(k); const can = S.canWrite && S.mcp && scoutDoc()[k + 'Trigger'];
  const fin = st.finishedAt ? new Date(st.finishedAt) : null;
  const last = fin ? `Last search ${fin.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}, ${fin.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}${st.added != null && !st.summary ? ` · ${st.added} new` : ''}` : (k === 'jobs' && jobCfg().lastScout ? 'Last search ' + esc(jobCfg().lastScout) : 'Not searched from here yet');
  if (st.running) { const pct = Math.max(3, Math.min(99, +st.pct || 3));
    return `<div class="scout running" role="status" aria-live="polite"><div class="sc-top"><span class="sc-dot"></span><b>Searching for ${I.what}…</b><span class="sc-pct">${pct}%</span></div>
      <div class="sc-bar"><i style="width:${pct}%"></i></div><div class="sc-step">${esc(st.step || 'Working…')}${st.added ? ` · ${st.added} found so far` : ''}${st.slow ? ' · taking longer than usual' : ''}</div>
      <div class="sc-note">You can leave this page. New finds appear as they’re saved, and nothing already found is changed or removed.</div></div>`; }
  return `<div class="scout"><div class="sc-top"><span>${ic('trend')}</span><div class="sc-meta"><b>${esc(last)}</b><span>${I.sched}.${st.state === 'error' ? ' The last search hit a problem: ' + esc(st.summary || 'try again') : st.summary ? ' ' + esc(st.summary) : ''}</span></div>
    ${can ? `<button class="btn primary" data-act="scout-run" data-k="${k}">${ic('search')} Search now</button>` : S.canWrite ? `<span class="sc-off">Search from here needs the Claude connector. Open the planner in the Claude app.</span>` : ''}</div></div>`;
}
async function runScout(k){
  const trig = scoutDoc()[k + 'Trigger']; if (!trig || !S.mcp) return;
  if (scoutState(k).running) { toast('A search is already running.'); return; }
  S.scoutLocal = { ...(S.scoutLocal || {}), [k]: { at: Date.now() } }; render();
  try {
    await S.mcp.callTool('Claude Code Remote', 'fire_trigger', { trigger_id: trig, text: `Manual run started from the Callsheet ${k === 'jobs' ? 'Jobs' : 'Deadlines'} tab at ${new Date().toISOString()}. Report progress as described, run:"manual".` });
    toast('Search started. It usually takes 5 to 15 minutes.');
    clearInterval(runScout.t); runScout.t = setInterval(() => { if (!['jobs','deadlines'].some(x => scoutState(x).running)) clearInterval(runScout.t); render(); }, 15000);
  } catch(e){
    S.scoutLocal = { ...(S.scoutLocal || {}), [k]: null }; render();
    const c = e && e.code; toast(c === 'server_not_connected' ? 'Connect “Claude Code Remote” in claude.ai Settings → Connectors to search from here.' : c === 'not_granted' || c === 'selection_required' ? 'Allow Callsheet to use the Claude connector (it will ask once), then try again.' : 'Couldn’t start the search. Try again in a moment.');

function relReadiness(ids){ const ss = ids.map(id => S.songs[id]).filter(Boolean); const n = ss.length; const at = k => ss.filter(s => songStage(s) >= k).length;

/* ---------- smart planner ---------- */
function freeIntervals(ds, fromM){
  const c = calCfg(); const dow = dowOf(ds); const weekend = dow === 0 || dow === 6;
  const wins = [];
  if (weekend) { if (c.windows.weekend.on) wins.push([toMin(c.windows.weekend.from), toMin(c.windows.weekend.to)]); }
  else ['morning','afternoon','evening'].forEach(k => { const w = c.windows[k]; if (w.on) wins.push([toMin(w.from), toMin(w.to)]); });
  const busy = [];
  const prevShiftLate = list('events').some(e => e.kind === 'shift' && e.date === addDays(ds, -1) && e.start && evEnd(e) >= 1440);
  if (prevShiftLate) busy.push([0, c.buffer]);
  list('events').forEach(e => {
    if (e.date !== ds) return;
    if (e.allDay || !e.start) { if (e.kind === 'shift' || e.kind === 'busy') busy.push([0, 1440]); return; }
    const b = e.kind === 'shift' ? c.buffer : 15; busy.push([toMin(e.start) - b, evEnd(e) + b]);
  });
  list('sessions').forEach(x => { if (x.date === ds && x.status !== 'suggested') busy.push([toMin(x.start) - 15, toMin(x.end) + 15]); });
  (S.gcal[ds] || []).forEach(g => { if (g.free) return; if (g.allDay) { if (g.shift) busy.push([0, 1440]); return; } const b = g.shift ? c.buffer : 15; busy.push([g.s - b, g.en + b]); });
  let free = wins.map(w => [Math.max(w[0], fromM || 0), w[1]]).filter(w => w[1] - w[0] >= 30);
  busy.forEach(([bs, be]) => { free = free.flatMap(([fs, fe]) => (be <= fs || bs >= fe) ? [[fs, fe]] : [[fs, bs], [be, fe]].filter(x => x[1] - x[0] >= 30)); });
  return free.sort((a, b) => a[0] - b[0]);
}
function taskDueDate(t){
  let best = t.due || '';
  list('deadlines').forEach(d => { if (d.projectId && d.projectId === t.projectId && d.date && !['submitted','result','skip'].includes(dlStatus(d)) && daysUntil(d.date) >= 0 && (!best || d.date < best)) best = d.date; });
  return best;
}
function planWeek(ws){
  const c = calCfg(); const today = todayStr(); const now = new Date(); const nowM = now.getHours() * 60 + now.getMinutes();
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  list('sessions').filter(x => x.status === 'suggested' && days.includes(x.date)).forEach(x => remove('sessions', x.id));
  let budget = c.target * 60 - weekMinutes(ws);
  if (budget < 30) return { n: 0, why: 'target' };
  const booked = new Set(list('sessions').filter(x => x.status === 'planned' && x.date >= today).flatMap(x => x.taskIds || []));
  let queue = list('tasks').filter(t => !t.done && !booked.has(t.id) && !(S.projects[t.projectId] || {}).archived)
    .map(t => ({ t, s: scoreTask(t).s, mins: Math.max(10, effMins(t)), admin: t.energy === 'admin' || (t.energy !== 'creative' && effMins(t) <= 20), due: taskDueDate(t) }));
  const preps = list('deadlines').filter(d => isFollowed(d) && d.date && daysUntil(d.date) >= 1 && daysUntil(d.date) <= 30 && !['submitted','result','skip'].includes(dlStatus(d)) && !(d.projectId && projectOpenTasks(d.projectId).length) && !list('sessions').some(x => x.deadlineId === d.id && x.status === 'planned'))
    .map(d => ({ prep: true, d, mins: 60, s: 40 / Math.max(1, daysUntil(d.date)) + 2, due: d.date }));
  queue = queue.concat(preps).sort((a, b) => b.s - a.s);
  const out = [];
  for (const ds of days) {
    if (ds < today) continue;
    let dayLeft = c.maxDay * 60 - dayMinutes(ds);
    const free = freeIntervals(ds, ds === today ? Math.ceil((nowM + 20) / 15) * 15 : 0);
    for (const iv of free) {
      let fs = iv[0]; const fe = iv[1];
      while (fe - fs >= 30 && budget >= 30 && dayLeft >= 30 && queue.length) {
        const room = Math.min(fe - fs, budget, dayLeft, 120);
        const ok = q => !q.due || q.due > ds;
        let picks = [], total = 0, kind = 'creative';
        if (room >= 75) {
          const first = queue.find(q => ok(q) && !q.admin);
          if (first) {
            picks.push(first); total = first.mins; kind = first.prep ? 'prep' : 'creative';
            if (!first.prep) for (const q of queue) { if (q === first || !ok(q) || q.prep || q.admin || q.t.projectId !== first.t.projectId) continue; if (total + q.mins <= room) { picks.push(q); total += q.mins; } }
          }
        }
        if (!picks.length) {
          const cap = Math.min(room, 45); kind = 'admin';
          for (const q of queue) { if (!ok(q) || q.prep || !q.admin) continue; if (total + q.mins <= cap) { picks.push(q); total += q.mins; } }
          if (!picks.length) {
            const any = queue.find(q => ok(q) && (q.mins <= room || room >= 45));
            if (any) { picks.push(any); total = any.mins; kind = any.prep ? 'prep' : any.admin ? 'admin' : 'creative'; }
          }
        }
        if (!picks.length) break;
        const dur = Math.max(30, Math.min(room, Math.ceil(total / 15) * 15));
        const first = picks[0];
        const pid = first.prep ? (first.d.projectId || '') : (first.t.projectId || '');
        const title = first.prep ? `Prep: ${first.d.title}` : kind === 'admin' ? (picks.length > 1 ? `Admin: ${picks.length} quick jobs` : first.t.title) : (pid && S.projects[pid] ? `${S.projects[pid].title}` : first.t.title);
        out.push({ id: uid(), date: ds, start: fromMin(fs), end: fromMin(fs + dur), title, projectId: pid, taskIds: picks.filter(q => !q.prep).map(q => q.t.id), deadlineId: first.prep ? first.d.id : '', kind, status: 'suggested', created: Date.now() });
        picks.forEach(q => { const i = queue.indexOf(q); if (i >= 0) queue.splice(i, 1); });
        if (picks.length === 1 && !first.prep && first.mins > dur) { first.mins -= dur; queue.push(first); queue.sort((a, b) => b.s - a.s); }
        fs += dur + 15; budget -= dur; dayLeft -= dur;
      }
    }
  }
  out.forEach(x => put('sessions', x));
  return { n: out.length, mins: out.reduce((a, x) => a + sesMins(x), 0) };
}

function docType(d){
  const u = String(d.url || '').toLowerCase(); const n = String(d.name || '').toLowerCase(); const m = String(d.mime || '');
  if (m.includes('google-apps.folder') || /drive\.google\.com\/drive\/(u\/\d+\/)?folders/.test(u)) return ['FOLDER','none','folder'];
  if (m.includes('google-apps.spreadsheet') || /docs\.google\.com\/spreadsheets/.test(u) || /\.(xlsx?|csv|numbers|ods)$/.test(n)) return ['SHEET','tv','chart'];
  if (m.includes('google-apps.presentation') || /docs\.google\.com\/presentation/.test(u) || /\.(pptx?|key|odp)$/.test(n)) return ['SLIDES','theatre','layers'];
  if (m.includes('google-apps.document') || /docs\.google\.com\/document/.test(u)) return ['DOC','film','file'];

  return ['LINK','short','link'];
}

async function driveSearch(query){
  const out = $('#drive-res'); if (!out) return;
  try {
    const qs = Array.isArray(query) ? query : [query]; const seen = new Set(); const files = [];
    for (const q of qs) { let token = '', n = 0;
      do { const r = await S.mcp.callTool('Google Drive', 'search_files', { query: q, pageSize: 50, excludeContentSnippets: true, ...(token ? { pageToken: token } : {}) }, { cache: false });
        const pl = (r && r.payload) || {}; (pl.files || []).forEach(f => { if (f && f.viewUrl && !seen.has(f.id) && !/folder$/.test(f.mimeType || '')) { seen.add(f.id); files.push(f); } });
        token = pl.nextPageToken || pl.next_page_token || ''; } while (token && ++n < 8 && files.length < 80);
      if (files.length >= 40) break; }
    files.sort((a, b) => (b.viewedByMeTime || b.modifiedTime || '').localeCompare(a.viewedByMeTime || a.modifiedTime || ''));
    S.driveRes = files;
    if (!$('#drive-res')) return;
    $('#drive-res').innerHTML = files.length ? `<div class="ai-list">${files.map((f, i) => { const [label, tone, icn] = docType({ mime: f.mimeType, name: f.title, url: f.viewUrl });
      return `<label class="ai-item"><input type="checkbox" data-i="${i}"><span class="ext" style="--c:var(--${tone})">${ic(icn)}${label}</span><span class="t">${esc(f.title || 'Untitled')}</span><span class="s muted">${f.modifiedTime ? fmtDate(f.modifiedTime.slice(0, 10), { noDay: true }) : ''}</span></label>`; }).join('')}</div>`
      : `<p class="ai-sub">No matches. Claude’s Google Drive connection can only see files made through Claude, not your whole Drive, so paste the file’s link above instead.</p>`;
  } catch(e){
    if (!$('#drive-res')) return;
    const msg = { server_not_connected: 'Add Google Drive in claude.ai Settings → Connectors to pick files here.', needs_reauth: 'Reconnect Google Drive in claude.ai Settings → Connectors.', not_in_manifest: 'Google Drive isn’t allowed on this page. Allow it from the page’s permissions.', selection_required: 'Choose which Google Drive connection to use when Claude asks.' }[e && e.code] || 'Couldn’t search Google Drive right now. Try again in a moment.';
    $('#drive-res').innerHTML = `<p class="ai-err">${esc(msg)}</p>`;
  }
}

/* ---------- weekly review ---------- */
function weekData(){
  const now = Date.now(), since = now - 7 * 864e5;
  const done = list('tasks').filter(t => t.done && t.doneAt && t.doneAt >= since);
  const mins = done.reduce((a,t) => a + (+t.mins || 30), 0);
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i); const st = d.getTime(), en = st + 864e5;
    days.push({ label: d.toLocaleDateString('en-GB', { weekday:'short' }), n: done.filter(t => t.doneAt >= st && t.doneAt < en).length, today: i === 0 }); }
  const moves = []; list('projects').forEach(p => (p.stageLog || []).forEach(l => { if (l.at >= since && l.to > l.from) moves.push({ p, ...l }); }));
  const active = list('projects').filter(p => !p.archived && !p.example);
  const quiet = active.filter(p => !p.lastTouched || now - p.lastTouched > 14 * 864e5);
  const nextDl = list('deadlines').filter(d => { const n = daysUntil(d.date); return n != null && n >= 0 && n <= 7 && !['submitted','result','skip'].includes(d.status); }).sort((a,b) => a.date.localeCompare(b.date));
  const ideas = list('ideas').filter(i => (i.created || 0) >= since);
  return { done, mins, days, moves, quiet, nextDl, ideas };
}

const AI = { ctl:null, pending:null };
const ABOUT = 'The person is an emerging UK-based writer-director and actor working across film, short film, TV, comedy, theatre and music.';
function aiErr(e){
  const c = e && e.code;
  if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)) { S.sample = null; setTimeout(render, 0); return 'Claude isn’t available on this page right now. If you declined the permission, reopen the page to be asked again.'; }
  if (c === 'rate_limited') return 'Too many requests for now. Try again in a little while.';
  if (c === 'session_expired') return 'Your Claude session has expired. Sign in again, then retry.';
  if (c === 'invalid_json') return 'The answer came back in an unexpected shape. Try again.';
  if (c === 'refused') return 'Claude couldn’t help with that one. Try rewording it.';
  return 'Something went wrong talking to Claude. Try again in a moment.';
}
function aiModal(title, sub){
  AI.ctl?.abort(); AI.ctl = new AbortController(); AI.pending = null;
  formCtx = { kind:'ai' };
  $('#modal-root').innerHTML = `<div class="scrim" data-act="scrim"><div class="modal ai" role="dialog" aria-modal="true" aria-labelledby="ai-title"><div class="ai-body">
    <h3 id="ai-title"><span class="hchip" style="--hc:var(--short)">${ic('wand')}</span>${esc(title)}</h3>${sub ? `<p class="ai-sub">${esc(sub)}</p>` : ''}
    <div id="ai-out" class="ai-out" aria-live="polite"><div class="thinking"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>Thinking…</div></div>
    <div class="actions"><button class="btn ghost" data-act="ai-stop" id="ai-stop">Stop</button><div class="r" id="ai-actions"><button class="btn ghost" data-act="close-modal">Close</button></div></div></div></div></div>`;
  return AI.ctl.signal;
}
const aiOut = html => { const o = $('#ai-out'); if (o) o.innerHTML = html; };
const aiDone = (extra = '') => { const st = $('#ai-stop'); if (st) st.hidden = true; const a = $('#ai-actions'); if (a) a.innerHTML = `<button class="btn ghost" data-act="close-modal">Close</button>${extra}`; };
const aiCurrent = signal => AI.ctl && AI.ctl.signal === signal;
function aiFail(e, signal){ if (!aiCurrent(signal)) return; if (e && e.code === 'cancelled') { closeModal(); return; } aiOut(`<p class="ai-err">${esc(aiErr(e))}</p>`); aiDone(); }
function projCtx(p){
  if (!p) return 'No specific project.';
  const SG = stagesFor(p.medium);
  const tasks = projectOpenTasks(p.id).slice(0, 12).map(t => `- ${t.title} (${fmtMins(+t.mins || 30)})`).join('\n');
  return `Project: ${p.title}\nType: ${MEDIA[p.medium] || p.medium}\nStage: ${SG[stageIdx(p)]} (stage ${stageIdx(p) + 1} of ${SG.length}: ${SG.join(' → ')})\n${p.logline ? 'Logline: ' + p.logline + '\n' : ''}${(p.genres || []).length ? 'Genres: ' + p.genres.join(', ') + '\n' : ''}${p.notes ? 'Notes: ' + p.notes.slice(0, 800) + '\n' : ''}Open steps:\n${tasks || '(none)'}`;
}
const fitMins = m => MINS.reduce((a,b) => Math.abs(b - m) < Math.abs(a - m) ? b : a, 30);
function renderPicks(items, label){
  aiOut(`<div class="ai-list">${items.map((x,i) => `<label class="ai-item"><input type="checkbox" checked data-i="${i}"><span class="t">${esc(x.title || x)}</span>${x.mins ? `<span class="pill">${fmtMins(x.mins)}</span>` : ''}${x.impact ? `<span class="pill">${IMPACT[x.impact]}</span>` : ''}</label>`).join('')}</div><p class="ai-sub">Untick anything you don’t want. You can edit them afterwards.</p>`);
  aiDone(`<button class="btn primary" data-act="ai-apply">${ic('plus')} ${label}</button>`);
}
async function aiBreak(t){
  if (!t || !S.sample) return; const p = S.projects[t.projectId];
  const signal = aiModal('Break it down', t.title);
  try {
    const arr = await S.sample.json(`${ABOUT}\n\n${projCtx(p)}\n\nBreak this step into 3 to 7 smaller, concrete actions that can each be done in one sitting, in the order to do them. Each should start with a verb and be under 12 words. Don't repeat these existing smaller steps: ${(t.subs || []).map(x => x.text).join('; ') || 'none'}.\n\nStep: ${t.title}\n\nReply with only a JSON array of strings, e.g. ["Reread the notes from Sam", "List the three scenes to cut"].`, { signal, cache: false });
    if (!aiCurrent(signal)) return;
    const items = (Array.isArray(arr) ? arr : []).map(x => String(x).trim()).filter(Boolean).slice(0, 8);
    if (!items.length) throw { code: 'invalid_json' };
    AI.pending = { kind:'subs', tid: t.id, items }; renderPicks(items, 'Add smaller steps');
  } catch(e){ aiFail(e, signal); }
}
async function aiSteps(p){
  if (!p || !S.sample) return;
  const signal = aiModal('Suggest next steps', p.title);
  const cl = checklistFor(p, stagesFor(p.medium)[stageIdx(p)]).items.filter(x => !x.done).map(x => x.text);
  try {
    const arr = await S.sample.json(`${ABOUT}\n\n${projCtx(p)}\nUnticked workflow items for this stage: ${cl.join('; ') || 'none'}\n\nSuggest 3 to 6 concrete next steps that would move this project forward most from where it is now. Don't repeat the open steps. Prefer small, specific actions. For each give a rough time in minutes (10 to 180), an impact from 1 (small nudge) to 3 (big leap), and whether it is "creative" or "admin" work.\n\nReply with only a JSON array like [{"title":"Rewrite the cold open so the premise lands on page 1","mins":45,"impact":3,"energy":"creative"}].`, { signal, cache: false });
    if (!aiCurrent(signal)) return;
    const items = (Array.isArray(arr) ? arr : []).filter(x => x && x.title).slice(0, 8).map(x => ({ title: String(x.title).trim(), mins: fitMins(+x.mins || 30), impact: [1,2,3].includes(+x.impact) ? +x.impact : 2, energy: ['creative','admin'].includes(x.energy) ? x.energy : '' }));
    if (!items.length) throw { code: 'invalid_json' };
    AI.pending = { kind:'tasks', pid: p.id, items }; renderPicks(items, 'Add to next steps');
  } catch(e){ aiFail(e, signal); }
}
function aiApply(){
  const r = AI.pending; if (!r) return;
  const keep = [...document.querySelectorAll('.ai-item input')].filter(x => x.checked).map(x => r.items[+x.dataset.i]);
  if (!keep.length) { closeModal(); return; }
  if (r.kind === 'subs') { const t = S.tasks[r.tid]; if (t) { S.expanded.add(t.id); put('tasks', { ...t, subs: [...(t.subs || []), ...keep.map(text => ({ text, done: false }))], ...(t.done ? { done: false, doneAt: null } : {}) }); } }
  if (r.kind === 'tasks') {
    const orders = list('tasks').filter(t => t.projectId === r.pid && !t.done && typeof t.order === 'number').map(t => t.order);
    let next = orders.length ? Math.max(...orders) + 1 : null;
    keep.forEach(x => { const doc = { id: uid(), title: x.title, projectId: r.pid, mins: x.mins, impact: x.impact, energy: x.energy, due: '', done: false, created: Date.now() }; if (next != null) doc.order = next++; put('tasks', doc); });
    touchProject(r.pid);
  }
  closeModal(); toast(`Added ${keep.length} ${r.kind === 'subs' ? 'smaller step' : 'step'}${keep.length > 1 ? 's' : ''}`);
}
async function aiText(title, sub, prompt, copyLabel){
  const signal = aiModal(title, sub);
  const show = t => aiOut(`<div class="ai-text" id="ai-text">${esc(t)}</div>`);
  const copyBtn = `<button class="btn primary" data-act="ai-copy">${ic('copy')} ${copyLabel || 'Copy'}</button>`;
  try {
    await S.sample(prompt, { signal, cache: false, onText: ({ text }) => { if (aiCurrent(signal)) show(text); } });
    if (aiCurrent(signal)) aiDone(copyBtn);
  } catch(e){
    if (!aiCurrent(signal)) return;
    if (e && e.code === 'cancelled') { if (e.text) { show(e.text); aiDone(copyBtn); } else closeModal(); return; }
    aiOut(`${e && e.text ? `<div class="ai-text" id="ai-text">${esc(e.text)}</div>` : ''}<p class="ai-err">${esc(aiErr(e))}</p>`); aiDone(e && e.text ? copyBtn : '');
  }
}

  song: { lyrics:'Lyrics & chords', recs:'Recordings', fix:'To fix & next steps', where:'Where it’s used' } };
function layoutOrder(lkey, keys){ const saved = ((CFG().layout || {})[lkey]) || []; return [...saved.filter(k => keys.includes(k)), ...keys.filter(k => !saved.includes(k))]; }
function layoutWrap(lkey, blocks){
  const hidden = new Set(((CFG().layout || {}).hidden || {})[lkey] || []); const arr = S.arrange === lkey && S.canWrite;
  const keys = layoutOrder(lkey, blocks.map(b => b[0])); const map = Object.fromEntries(blocks);
  const inner = keys.map(k => { const off = hidden.has(k); if (off && !arr) return ''; const html = map[k] || '';
    if (!arr && !html) return '';
    return `<div class="lblock ${arr ? 'arr' : ''} ${off ? 'is-off' : ''}" data-sk="${k}" data-handle>${arr ? `<div class="lbar"><span class="sgrip" title="Drag to move">${ic('move')}<b>${esc(LAYOUT_LABEL[lkey][k] || k)}</b>${html ? '' : '<em>Nothing to show right now</em>'}</span><button class="btn small ghost" data-act="lhide" data-l="${lkey}" data-k="${k}">${off ? 'Show' : 'Hide'}</button></div>` : ''}${off ? '' : html}</div>`; }).join('');
  const bar = arr ? `<div class="arrange-bar"><span>${ic('move')} Drag sections into the order you want. Hide the ones you don’t need.</span><span style="display:flex;gap:6px"><button class="btn small ghost" data-act="lreset" data-l="${lkey}">Reset</button><button class="btn small primary" data-act="arrange" data-l="">${ic('check')} Done</button></span></div>` : '';

const SORT = {
  layout: { drop({ to, keys }){ const L = { ...(CFG().layout || {}) }; L[to.dataset.lkey] = keys; saveSettings({ layout: L }); } },
  folders: { drop({ keys }){ saveSettings({ folderOrder: keys }); } },
  songs: { drop({ keys }){ keys.forEach((k, i) => { const q = S.songs[k]; if (q && q.order !== i) put('songs', { ...q, order: i }); }); } },
  tracks: { drop({ to }){ const L = to.closest('.picker').querySelector('[data-role=list]'); pickerSave('tracks', L.dataset.o, [...L.children].map(c => c.dataset.sk).filter(Boolean)); } },
  setsongs: { drop({ to }){ const L = to.closest('.picker').querySelector('[data-role=list]'); pickerSave('setsongs', L.dataset.o, [...L.children].map(c => c.dataset.sk).filter(Boolean)); } },
  plan: { drop({ key, from, to, keys }){ const P = planPins(); const z = to.dataset.zone;
    if (z === 'plan') { P.out = P.out.filter(k => k !== key); if (from.dataset.zone !== 'plan') P.in.push(key); P.order = keys; }
    else { P.in = P.in.filter(k => k !== key); if (!P.out.includes(key)) P.out.push(key); P.order = P.order.filter(k => k !== key); }
    savePlanPins(P); if (from.dataset.zone !== z) toast(z === 'plan' ? 'Added to today’s plan' : 'Taken out of today’s plan'); } },
  projects: {
    drop({ key, to, keys }){ const f = to.dataset.folder || ''; const p = S.projects[key];
      keys.forEach((k, i) => { const q = S.projects[k]; if (!q) return; const patch = {}; if (q.order !== i) patch.order = i; if (k === key && (q.folder || '') !== f) patch.folder = f; if (Object.keys(patch).length) put('projects', { ...q, ...patch }); });
      if (p && (p.folder || '') !== f) toast(f ? `Moved to ${f}` : 'Taken out of its folder'); },
    into({ key, el }){ const p = S.projects[key]; const f = el.dataset.folder || ''; if (p && (p.folder || '') !== f) { put('projects', { ...p, folder: f, order: 1e6 }); toast(f ? `Moved to ${f}` : 'Taken out of its folder'); } }
  },
  jobs: { drop({ key, to, keys }){ const j = S.jobs[key]; const st = to.dataset.stage; if (j && st && j.status !== st) moveJob(j, st);
    keys.forEach((k, i) => { const q = S.jobs[k]; if (q && q.order !== i) put('jobs', { ...q, order: i }); }); } },
  todo: { drop({ key, to, keys }){ const t = S.tasks[key]; const g = to.dataset.pgroup;
    if (t) { const cur = +t.priority || 3; const np = g === 'hi' ? (cur >= 4 ? cur : 4) : g === 'lo' ? (cur <= 2 ? cur : 2) : 3; if (np !== cur) { put('tasks', { ...t, priority: np }); toast(`Priority set to ${np} · ${PRIORITY[np]}`); } }
    keys.forEach((k, i) => { const q = S.tasks[k]; if (q && q.todoOrder !== i) put('tasks', { ...q, todoOrder: i }); }); } },
  people: { drop({ keys }){ keys.forEach((k, i) => { const q = S.people[k]; if (q && q.order !== i) put('people', { ...q, order: i }); }); } },
  ideas: { drop({ keys }){ keys.forEach((k, i) => { const q = S.ideas[k]; if (q && q.order !== i) put('ideas', { ...q, order: i }); }); } },
  docs: {
    drop({ key, to }){ const p = S.projects[to.dataset.pid]; if (!p) return; const sheet = to.closest('.docs-sheet'); const docs = p.docs || [];
      const seen = []; sheet.querySelectorAll('[data-sort="docs"]').forEach(b => [...b.children].forEach(c => { if (c.dataset.sk) seen.push([c.dataset.sk, b.dataset.dfolder || '']); }));
      const byId = Object.fromEntries(docs.map(d => [d.id, d]));
      const out = seen.filter(([id]) => byId[id]).map(([id, f]) => ({ ...byId[id], folder: f })); docs.forEach(d => { if (!seen.some(([id]) => id === d.id)) out.push(d); });
      put('projects', { ...p, docs: out }); },
    into({ key, el }){ const p = S.projects[el.dataset.pid]; if (!p) return; const f = el.dataset.dfolder || '';
      put('projects', { ...p, docs: (p.docs || []).map(d => d.id === key ? { ...d, folder: f } : d) }); toast(`Moved to ${f || 'the top level'}`); }
  },
};
(function(){
  let pend = null, eat = false;
  const itemsOf = box => [...box.children].filter(c => c.dataset && c.dataset.sk != null && !c.classList.contains('sph'));
  function start(){
    const { item, box, x, y } = pend; pend = null; clearTimeout(start.t);
    const r = item.getBoundingClientRect(); const ghost = item.cloneNode(true); ghost.classList.add('sghost'); ghost.removeAttribute('id');
    Object.assign(ghost.style, { width: r.width + 'px', height: r.height + 'px', left: r.left + 'px', top: r.top + 'px' });
    const ph = document.createElement(item.tagName === 'BUTTON' ? 'div' : item.tagName); ph.className = 'sph ' + (item.className || ''); ph.style.height = r.height + 'px'; ph.innerHTML = '';
    item.before(ph); item.style.display = 'none'; document.body.appendChild(ghost); document.body.classList.add('sdragging');
    SD = { item, box, group: box.dataset.sort, ghost, ph, dx: x - r.left, dy: y - r.top, into: null };
    try { navigator.vibrate && navigator.vibrate(12); } catch(_){}
  }
  function finish(cancel){
    clearTimeout(start.t); pend = null; if (!SD) return;
    const { item, box, ghost, ph, group, into } = SD; ghost.remove(); document.body.classList.remove('sdragging'); document.querySelectorAll('.sdrop').forEach(x => x.classList.remove('sdrop'));
    const to = ph.parentElement; ph.replaceWith(item); item.style.display = '';
    SD = null; eat = true; setTimeout(() => eat = false, 60);
    if (!cancel) {
      const key = item.dataset.sk; const H = SORT[group];
      if (into && H.into) H.into({ key, el: into });
      else if (to && H.drop) { const keys = itemsOf(to).map(c => c.dataset.sk); const moved = to !== box || keys.join() !== (box._keys || ''); if (moved) H.drop({ key, item, from: box, to, keys }); }
    }
    renderPending = false; render();
  }
  document.addEventListener('pointerdown', e => {
    if (!S.canWrite || e.button > 0 || SD) return;
    if (e.target.closest('input,select,textarea,.grip,[contenteditable],.positioning')) return;
    const item = e.target.closest('[data-sk]'); if (!item) return; const box = item.parentElement;
    if (!box || !box.dataset.sort || !SORT[box.dataset.sort]) return;
    if (item.hasAttribute('data-handle') && !e.target.closest('.sgrip')) return;
    box._keys = itemsOf(box).map(c => c.dataset.sk).join();
    pend = { item, box, x: e.clientX, y: e.clientY, touch: e.pointerType !== 'mouse', handle: !!e.target.closest('.sgrip') };
    if (pend.touch) start.t = setTimeout(() => { if (pend) start(); }, pend.handle ? 120 : 380);
  });
  document.addEventListener('contextmenu', e => { if (SD || pend) e.preventDefault(); });
  document.addEventListener('dragstart', e => { if (e.target.closest && e.target.closest('[data-sort] [data-sk]')) e.preventDefault(); });
  document.addEventListener('pointermove', e => {
    if (pend && !SD) { const dx = Math.abs(e.clientX - pend.x), dy = Math.abs(e.clientY - pend.y);
      if (pend.touch) { if (dx > 8 || dy > 8) { clearTimeout(start.t); pend = null; } return; }
      if (dx + dy > 7) start(); else return; }
    if (!SD) return; e.preventDefault();
    const x = e.clientX, y = e.clientY; SD.ghost.style.left = (x - SD.dx) + 'px'; SD.ghost.style.top = (y - SD.dy) + 'px';
    const el = document.elementFromPoint(x, y); if (!el) return;
    const into = el.closest(`[data-drop="${SD.group}"]`);
    document.querySelectorAll('.sdrop').forEach(n => { if (n !== into) n.classList.remove('sdrop'); });
    if (into) { SD.into = into; into.classList.add('sdrop'); }
    else { SD.into = null;
      const tbox = el.closest(`[data-sort="${SD.group}"]`);
      if (tbox && (SD.group !== 'layout' || tbox === SD.box)) {
        const its = itemsOf(tbox).filter(c => c !== SD.item);
        const before = its.find(c => { const r = c.getBoundingClientRect(); return y < r.top || (y <= r.bottom && x < r.left + r.width / 2 && (r.width < tbox.clientWidth * .9)) || (r.width >= tbox.clientWidth * .9 && y < r.top + r.height / 2); });

        else { const last = its[its.length - 1]; if (last) { if (last.nextElementSibling !== SD.ph) last.after(SD.ph); } else if (SD.ph.parentElement !== tbox) tbox.prepend(SD.ph); }
      }
    }
    if (y < 80) window.scrollBy(0, -14); else if (y > innerHeight - 110) window.scrollBy(0, 14);

  }, { passive: false });

  document.addEventListener('click', e => { if (eat) { e.stopPropagation(); e.preventDefault(); } }, true);
})();

function parseTime(x){ x = String(x).trim().toLowerCase(); if (!x) return 0; const h = x.match(/^(\d+(?:\.\d+)?)h$/); if (h) return Math.round(+h[1] * 60); const m = x.match(/^(\d+)m?$/); return m ? +m[1] : 0; }
const TYPE_BY_EXT = { pdf:'application/pdf', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', gif:'image/gif', svg:'image/svg+xml', mp4:'video/mp4', webm:'video/webm', txt:'text/plain', md:'text/markdown', csv:'text/csv', json:'application/json' };
$('#file-input').addEventListener('change', async e => {
  const f = e.target.files[0]; const pid = e.target.dataset.pid; const mode = e.target.dataset.mode || 'doc';
  const folder = e.target.dataset.folder || ''; e.target.dataset.mode = ''; e.target.dataset.folder = ''; e.target.accept = '.pdf,.png,.jpg,.jpeg,.webp,.gif,.svg,.mp4,.webm,.txt,.md,.csv,.json';
  const sid = e.target.dataset.sid; e.target.dataset.sid = '';
  if (!f || !S.assets) return;
  if (mode === 'font') {
    const ext = (f.name.split('.').pop() || '').toLowerCase(); const type = { ttf:'font/ttf', otf:'font/otf', woff:'font/woff', woff2:'font/woff2' }[ext];
    if (!type) { toast('Upload a .ttf, .otf, .woff or .woff2 font file.'); return; }
    toast('Uploading ' + f.name + '…');
    try { const r = await S.assets.upload(f, { type }); const name = f.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').slice(0, 40);
      saveSettings({ customFonts: [...(CFG().customFonts || []), { key: 'cf-' + uid(), kind: 'file', name, assetId: r.id }] }); toast(`Added ${name}. Pick it in any project’s title font.`); }
    catch(err){ toast(err && err.code === 'unsupported_type' ? 'That font file couldn’t be stored. Try a .woff2 or .ttf version.' : 'The upload didn’t work. Try again in a moment.'); }
    return;
  }
  if (mode === 'titleimg') {
    const ext = (f.name.split('.').pop() || '').toLowerCase(); const type = { png:'image/png', svg:'image/svg+xml', webp:'image/webp' }[ext];
    if (!type) { toast('Upload a PNG (ideally with a transparent background), SVG or WebP.'); return; }
    toast('Uploading title image…');
    try { const r = await S.assets.upload(f, { type }); const p = S.projects[pid]; const old = p.titleImg; put('projects', { ...p, titleImg: r.id, lastTouched: Date.now() }); if (old) { try { await S.assets.delete(old); } catch(_){} } toast('Title image added'); }
    catch(err){ toast(err && err.code === 'too_large' ? 'That image is too big. SVGs must be under 2 MB.' : 'The upload didn’t work. Try again in a moment.'); }
    return;
  }
  if (mode === 'rec') {
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    const type = { m4a:'video/mp4', mp4:'video/mp4', aac:'video/mp4', mov:'video/mp4', webm:'video/webm', ogg:'video/webm', opus:'video/webm', mp3:'audio/mpeg', wav:'audio/wav' }[ext];
    if (!type) { toast('Upload an .m4a (iPhone Voice Memos), .mp4 or .webm file, or add a link instead.'); return; }
    if (f.size > 20 * 1024 * 1024) { toast('That recording is over 20 MB. Add it as a Drive, Dropbox or SoundCloud link instead.'); return; }
    toast('Uploading ' + f.name + '…');
    try { const r = await S.assets.upload(f, { type }); const so = S.songs[sid]; if (so) put('songs', { ...so, recs: [...(so.recs || []), { id: uid(), kind: 'file', assetId: r.id, mime: type, name: f.name.replace(/\.[^.]+$/, ''), note: '', added: Date.now() }], updated: Date.now() }); toast('Recording added'); }
    catch(err){ toast(err && err.code === 'unsupported_type' ? `${ext.toUpperCase()} files can’t be stored here. Upload an .m4a (iPhone Voice Memos) or add a link.` : err && err.code === 'too_large' ? 'That recording is over 20 MB. Add it as a link instead.' : 'The upload didn’t work. Try again in a moment.'); }
    return;
  }
  if (mode === 'cover') {
    const ext = (f.name.split('.').pop() || '').toLowerCase(); const type = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', gif:'image/gif' }[ext];
    if (!type) { toast('Pick a JPG, PNG, WebP or GIF image for the cover.'); return; }
    toast('Uploading cover…');
    try { const r = await S.assets.upload(f, { type }); const p = S.projects[pid]; const old = p.cover;

      if (old) { try { await S.assets.delete(old); } catch(_){} } toast('Cover added'); }
    catch(err){ toast({ too_large:'That image is over 20 MB.', quota_or_state:'Storage is full. Remove an old file first.' }[err && err.code] || 'The upload didn’t work. Try again in a moment.'); }

  const ext = (f.name.split('.').pop() || '').toLowerCase(); const type = TYPE_BY_EXT[ext];

    toast('Uploaded ' + f.name);
  } catch(err){
    const msg = { too_large:'That file is over 20 MB.', unsupported_type:'That file type can’t be stored. Try a PDF.', quota_or_state:'Storage is full. Remove an old file first.', rate_limited:'Too many uploads at once. Wait a moment and try again.' }[err && err.code] || 'The upload didn’t work. Try again in a moment.';
    toast(msg);
  }
});

(async () => { try { const m = await window.claude?.use?.('mcp'); if (m) { S.mcp = m; render(); } } catch(_){} })();
(async () => {
